# fly.toml app configuration file generated for jevsentinel on 2026-09-24T23:16:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jevsentinel'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

[processes]
  app = 'node src/telegram-run.mjs'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'always'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

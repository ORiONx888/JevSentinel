name: Deploy JevSentinel Telegram Bot

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: jevsentinel-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install dependencies and run tests
        run: npm install && npm test

      - name: Verify required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TYPESAFE_API_KEY" || { echo "TYPESAFE_API_KEY is missing"; exit 1; }
          echo "Required GitHub secrets are present."
          flyctl secrets set --app jevsentinel TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" TYPESAFE_API_KEY="$TYPESAFE_API_KEY"

      - name: Require and preserve the existing persistent group-state volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          VOLUMES="$(flyctl volumes list --app jevsentinel --json)"
          MACHINE_COUNT="$(flyctl machine list --app jevsentinel --json | jq 'length')"
          test "$MACHINE_COUNT" = "1" || { echo "ERROR: expected exactly 1 JEV machine before deploy; found $MACHINE_COUNT. Refusing deploy."; exit 1; }
          ATTACHED_COUNT="$(printf '%s' "$VOLUMES" | jq '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)] | length')"
          test "$ATTACHED_COUNT" = "1" || { echo "ERROR: expected exactly 1 attached persistent JEV volume; found $ATTACHED_COUNT. Refusing deploy."; exit 1; }
          ATTACHED_ID="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state!="pending_destroy" and .attached_machine_id != null)] | sort_by(.created_at) | last | .id // empty')"
          ATTACHED_REGION="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state!="pending_destroy" and .attached_machine_id != null)] | sort_by(.created_at) | last | .region // empty')"

          if [ -z "$ATTACHED_ID" ] || [ -z "$ATTACHED_REGION" ]; then
            echo "ERROR: no existing attached jevsentinel_data volume was found."
            echo "Refusing to create a new production volume because that would risk losing persistent group state."
            printf '%s' "$VOLUMES" | jq -r '.[] | [.id,.state,.name,.region,.attached_machine_id,.created_at] | @tsv'
            exit 1
          fi

          echo "Preserving existing volume: $ATTACHED_ID in $ATTACHED_REGION"
          echo "JEv_VOLUME_ID=$ATTACHED_ID" >> "$GITHUB_ENV"
          echo "JEv_VOLUME_REGION=$ATTACHED_REGION" >> "$GITHUB_ENV"
          sed -i "s/^primary_region = .*/primary_region = \"$ATTACHED_REGION\"/" fly.toml

      - name: Deploy without replacing the persistent volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Deploying in-place with existing volume $JEv_VOLUME_ID."
          flyctl deploy --remote-only

      - name: Verify single running machine and attached volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          MACHINE_COUNT="$(flyctl machine list --app jevsentinel --json | jq 'length')"
          test "$MACHINE_COUNT" = "1" || { echo "ERROR: deploy produced $MACHINE_COUNT machines; refusing to declare success."; exit 1; }
          flyctl status --app jevsentinel
          flyctl volumes list --app jevsentinel

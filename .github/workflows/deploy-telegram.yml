name: Deploy JevSentinel Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: jevsentinel-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install dependencies and run tests
        run: npm install && npm test

      - name: Verify required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TYPESAFE_API_KEY" || { echo "TYPESAFE_API_KEY is missing"; exit 1; }
          echo "Required GitHub secrets are present."
          flyctl secrets set --app jevsentinel TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" TYPESAFE_API_KEY="$TYPESAFE_API_KEY"

      - name: Enforce single Telegram polling instance
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count 1 --app jevsentinel --yes

      - name: Ensure persistent group-state volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          VOLUME_REGION="$(flyctl volumes list --app jevsentinel --json | jq -r '.[] | select(.Name=="jevsentinel_data" and .State!="pending_destroy") | .Region' | head -n1)"
          if [ -z "$VOLUME_REGION" ]; then
            for region in yul ord ewr iad; do
              echo "Trying persistent volume in $region..."
              if flyctl volumes create jevsentinel_data --app jevsentinel --region "$region" --size 1 --yes; then
                VOLUME_REGION="$region"
                break
              fi
            done
          fi
          test -n "$VOLUME_REGION" || { echo "Could not create or locate jevsentinel_data in any candidate region."; exit 1; }
          echo "Using jevsentinel_data in region: $VOLUME_REGION"
          echo "JEv_VOLUME_REGION=$VOLUME_REGION" >> "$GITHUB_ENV"
          sed -i "s/^primary_region = .*/primary_region = \"$VOLUME_REGION\"/" fly.toml

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Enforce single running machine after deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl scale count 1 --app jevsentinel --yes
          flyctl status --app jevsentinel

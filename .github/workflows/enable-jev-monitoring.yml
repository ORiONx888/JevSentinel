name: Enable JEV Persisted Monitoring

on:
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Re-enable persisted JEV group monitoring
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console --app jevsentinel --machine 857100a4049168 -C "node --input-type=module -e \"import('./src/groupStore.js').then(({createGroupStore})=>{const s=createGroupStore();const g=s.load();s.save(g.map(x=>({...x,enabled:true})));const after=s.load();console.log(JSON.stringify({updated:g.length,enabled:after.filter(x=>x.enabled!==false).length}));})\""

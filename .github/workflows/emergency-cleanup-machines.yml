name: Verify JEV Recovery

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify single live machine and persisted group state
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app jevsentinel
          flyctl machine status 857100a4049168 --app jevsentinel
          flyctl ssh console --app jevsentinel --machine 857100a4049168 -C 'ls -l /data/groups.enc'
          flyctl ssh console --app jevsentinel --machine 857100a4049168 -C "node --input-type=module -e 'import("./src/groupStore.js").then(({createGroupStore})=>{const g=createGroupStore().load();console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length,groups:g.map(x=>({enabled:x.enabled,mode:x.mode,chatId:x.chatId}))}))})'"
          flyctl logs --app jevsentinel --machine 857100a4049168 --no-tail | tail -n 150

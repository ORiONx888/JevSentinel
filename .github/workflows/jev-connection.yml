name: JEV Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Verify Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          node --input-type=module -e 'const t=process.env.TELEGRAM_BOT_TOKEN; const r=await fetch("https://api.telegram.org/bot"+t+"/getMe"); const j=await r.json(); if(!r.ok||!j.ok) throw new Error("Telegram bot token verification failed"); console.log("Telegram bot connected: @"+j.result.username);'
      - name: Run official JEV SDK test
        run: npm run jev:test

  storage-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify production storage and audit orphan volumes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="jevsentinel"
          MACHINES="$(flyctl machine list --app "$APP" --json)"

          echo "=== CLEAN UP STALE AUDIT MACHINES ==="
          AUDIT_MACHINES="$(printf '%s' "$MACHINES" | jq -r '.[] | select(.name | startswith("audit-")) | .id')"
          while IFS= read -r AUDIT_MACHINE; do
            [ -n "$AUDIT_MACHINE" ] || continue
            echo "Destroying stale audit machine $AUDIT_MACHINE"
            flyctl machine destroy "$AUDIT_MACHINE" --app "$APP" --force || true
          done <<< "$AUDIT_MACHINES"

          MACHINES="$(flyctl machine list --app "$APP" --json)"
          VOLUMES="$(flyctl volumes list --app "$APP" --json)"

          MACHINE_COUNT="$(printf '%s' "$MACHINES" | jq 'length')"
          test "$MACHINE_COUNT" = "1" || { echo "FAIL: expected exactly 1 production machine after audit cleanup, found $MACHINE_COUNT"; exit 1; }
          PROD_MACHINE="$(printf '%s' "$MACHINES" | jq -r '.[0].id')"
          PROD_STATE="$(printf '%s' "$MACHINES" | jq -r '.[0].state')"
          test "$PROD_STATE" = "started" || { echo "FAIL: production machine $PROD_MACHINE is $PROD_STATE"; exit 1; }
          PROD_CONFIG="$(flyctl machine status "$PROD_MACHINE" --app "$APP" --display-config | sed -r 's/\x1B\[[0-9;]*[mK]//g')"
          ATTACHED_COUNT="$(printf '%s' "$VOLUMES" | jq '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)] | length')"
          test "$ATTACHED_COUNT" = "1" || { echo "FAIL: expected exactly 1 attached created jevsentinel_data volume, found $ATTACHED_COUNT"; exit 1; }
          PROD_VOLUME="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].id')"
          PROD_VOLUME_MACHINE="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].attached_machine_id')"
          test "$PROD_VOLUME_MACHINE" = "$PROD_MACHINE" || { echo "FAIL: production volume is attached to $PROD_VOLUME_MACHINE, not $PROD_MACHINE"; exit 1; }

          set +e
          GROUPS_CHECK="$(flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -s /data/groups.enc' 2>&1)"
          GROUPS_RC=$?
          set -e
          echo "$GROUPS_CHECK"
          test "$GROUPS_RC" = "0" || { echo "FAIL: production groups.enc check failed"; exit 1; }
          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'stat -c "groups.enc size=%s bytes" /data/groups.enc'

          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -f ./src/groupStore.js'

          set +e
          GROUPSTORE_CHECK="$(flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'node --input-type=module -e "import(\"./src/groupStore.js\").then(({createGroupStore})=>{const g=createGroupStore().load();console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length}));if(g.length!==1||g.filter(x=>x.enabled!==false).length!==1)process.exit(1)})"' 2>&1)"
          GROUPSTORE_RC=$?
          set -e
          echo "$GROUPSTORE_CHECK"
          test "$GROUPSTORE_RC" = "0" || { echo "FAIL: production groupStore check failed"; exit 1; }

          echo "=== PRODUCTION VOLUME ==="
          printf '%s' "$VOLUMES" | jq -r --arg id "$PROD_VOLUME" '.[] | select(.id==$id) | [.id,.state,.region,.attached_machine_id,.created_at] | @tsv'
          echo "=== ORPHAN VOLUMES ==="
          ORPHANS="$(printf '%s' "$VOLUMES" | jq -r --arg prod "$PROD_VOLUME" '.[] | select(.id != $prod and .name=="jevsentinel_data" and .state=="created" and .attached_machine_id==null) | [.id,.region,.created_at] | @tsv')"

          if [ -z "$ORPHANS" ]; then
            echo "No detached created jevsentinel_data volumes."
            exit 0
          fi

          NONEMPTY=0
          RECOVERED=0
          while IFS=$'\t' read -r VOL REGION CREATED; do
            [ -n "$VOL" ] || continue
            echo "--- reconciling $VOL region=$REGION created=$CREATED ---"
            SNAPSHOTS="$(flyctl volumes snapshots list "$VOL" --app "$APP" --json 2>/dev/null || true)"
            echo "$SNAPSHOTS" | jq -r '.[]? | [.id,.created_at,.size] | @tsv' || true
            SNAPSHOT_ID="$(echo "$SNAPSHOTS" | jq -r 'sort_by(.created_at) | last.id // empty')"
            if [ -z "$SNAPSHOT_ID" ]; then
              echo "FAIL: orphan $VOL has no usable snapshot; it cannot be reconciled safely."
              exit 1
            fi
            VOL_SIZE="$(printf '%s' "$VOLUMES" | jq -r --arg id "$VOL" '.[] | select(.id==$id) | .size_gb')"
            test -n "$VOL_SIZE" && test "$VOL_SIZE" != "null" || { echo "FAIL: could not determine size for $VOL"; exit 1; }
            RECOVERY_VOL=""
            RECOVERY_MACHINE=""
            cleanup_recovery() {
              set +e
              [ -z "$RECOVERY_MACHINE" ] || flyctl machine destroy "$RECOVERY_MACHINE" --app "$APP" --force >/dev/null 2>&1 || true
              [ -z "$RECOVERY_VOL" ] || flyctl volumes destroy "$RECOVERY_VOL" --app "$APP" --yes >/dev/null 2>&1 || true
              set -e
            }
            trap cleanup_recovery EXIT
            set +e
            CREATE_VOL_OUTPUT="$(flyctl volumes create "audit_r_${VOL#vol_}" --app "$APP" --region "$REGION" --size "$VOL_SIZE" --snapshot-id "$SNAPSHOT_ID" --yes 2>&1)"
            CREATE_VOL_RC=$?
            set -e
            echo "$CREATE_VOL_OUTPUT"
            test "$CREATE_VOL_RC" = "0" || { echo "FAIL: snapshot restore volume creation failed for $VOL (rc=$CREATE_VOL_RC)"; exit 1; }
            RECOVERY_VOL="$(printf '%s\n' "$CREATE_VOL_OUTPUT" | sed -n 's/.*ID: \([^[:space:]]*\).*/\1/p' | tail -n1)"
            [ -n "$RECOVERY_VOL" ] || RECOVERY_VOL="$(flyctl volumes list --app "$APP" --json | jq -r --arg n "audit_r_${VOL#vol_}" '[.[] | select(.name==$n)] | .[-1].id // empty')"
            test -n "$RECOVERY_VOL" || { echo "FAIL: could not identify recovery volume"; exit 1; }
            set +e
            INSPECTION_OUTPUT="$(flyctl machine run alpine:3.20 "sh -lc 'find /data -mindepth 1 -maxdepth 3 -type f ! -path "/data/lost+found/*" -printf "%p\t%s bytes\n" | sort'" --app "$APP" --region "$REGION" --volume "$RECOVERY_VOL:/data" --name "audit_r_${VOL#vol_}" --rm 2>&1)"
            RC=$?
            set -e
            echo "$INSPECTION_OUTPUT"
            test "$RC" = "0" || { echo "FAIL: recovery inspection failed for $VOL"; exit 1; }
            FILES="$INSPECTION_OUTPUT"
            if [ -n "$FILES" ]; then
              echo "RECOVERED_ORPHAN=$VOL"
              echo "RECOVERED_FILES_BEGIN"
              echo "$FILES"
              echo "RECOVERED_FILES_END"
              NONEMPTY=$((NONEMPTY + 1))
            else
              echo "EMPTY_RECOVERED_SNAPSHOT=$VOL"
            fi
            RECOVERED=$((RECOVERED + 1))
            trap - EXIT
            set +e
            flyctl machine destroy "$RECOVERY_MACHINE" --app "$APP" --force >/dev/null 2>&1 || true
            flyctl volumes destroy "$RECOVERY_VOL" --app "$APP" --yes >/dev/null 2>&1 || true
            set -e
            RECOVERY_MACHINE=""
            RECOVERY_VOL=""
          done <<< "$ORPHANS"
          EXPECTED_ORPHANS="$(printf '%s\n' "$ORPHANS" | grep -c .)"
          test "$RECOVERED" = "$EXPECTED_ORPHANS" || { echo "FAIL: not every orphan was reconciled"; exit 1; }
          test "$NONEMPTY" = "0" || { echo "FAIL: orphan volume(s) contain recoverable files; originals preserved."; exit 1; }
          echo "PASS: every detached created jevsentinel_data volume was snapshot-reconciled and contained no recoverable files. Original volumes preserved."


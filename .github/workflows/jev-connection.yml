name: JEV Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Verify Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          node --input-type=module -e 'const t=process.env.TELEGRAM_BOT_TOKEN; const r=await fetch("https://api.telegram.org/bot"+t+"/getMe"); const j=await r.json(); if(!r.ok||!j.ok) throw new Error("Telegram bot token verification failed"); console.log("Telegram bot connected: @"+j.result.username);'
      - name: Run official JEV SDK test
        run: npm run jev:test

  storage-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify production storage and audit orphan volumes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          APP="jevsentinel"
          echo "=== CLEANUP STALE AUDIT MACHINES ==="
          flyctl machine list --app "$APP" --json | jq -r '.[] | select(.name | startswith("audit-")) | .id' | while read -r AUDIT_ID; do
            [ -n "$AUDIT_ID" ] || continue
            echo "Removing stale audit machine $AUDIT_ID"
            flyctl machine destroy "$AUDIT_ID" --app "$APP" --force || true
          done
          sleep 2
          MACHINES="$(flyctl machine list --app "$APP" --json)"
          VOLUMES="$(flyctl volumes list --app "$APP" --json)"

          MACHINE_COUNT="$(printf '%s' "$MACHINES" | jq 'length')"
          test "$MACHINE_COUNT" = "1" || { echo "FAIL: expected exactly 1 production machine, found $MACHINE_COUNT"; exit 1; }
          PROD_MACHINE="$(printf '%s' "$MACHINES" | jq -r '.[0].id')"
          PROD_STATE="$(printf '%s' "$MACHINES" | jq -r '.[0].state')"
          test "$PROD_STATE" = "started" || { echo "FAIL: production machine $PROD_MACHINE is $PROD_STATE"; exit 1; }

          ATTACHED_COUNT="$(printf '%s' "$VOLUMES" | jq '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)] | length')"
          test "$ATTACHED_COUNT" = "1" || { echo "FAIL: expected exactly 1 attached created jevsentinel_data volume, found $ATTACHED_COUNT"; exit 1; }
          PROD_VOLUME="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].id')"
          PROD_VOLUME_MACHINE="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].attached_machine_id')"
          test "$PROD_VOLUME_MACHINE" = "$PROD_MACHINE" || { echo "FAIL: production volume is attached to $PROD_VOLUME_MACHINE, not $PROD_MACHINE"; exit 1; }

          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -s /data/groups.enc'
          PROD_GROUPS_HASH="$(flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'sha256sum /data/groups.enc' | awk '{print $1}' | tail -n1)"
          test -n "$PROD_GROUPS_HASH" || { echo "FAIL: could not hash production groups.enc"; exit 1; }
          echo "Production groups.enc SHA256=$PROD_GROUPS_HASH"
          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'node --input-type=module -e "import(\"./src/groupStore.js\").then(({createGroupStore})=>{const g=createGroupStore().load();if(g.length!==1||g.filter(x=>x.enabled!==false).length!==1)process.exit(1);console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length}))})"'

          echo "=== ALL JEV VOLUMES ==="
          printf '%s' "$VOLUMES" | jq -r '.[] | [.id,.state,.name,.region,(.attached_machine_id // "-"),.created_at] | @tsv'
          echo "=== PRODUCTION VOLUME ==="
          printf '%s' "$VOLUMES" | jq -r --arg id "$PROD_VOLUME" '.[] | select(.id==$id) | [.id,.state,.region,.attached_machine_id,.created_at] | @tsv'
          echo "=== ORPHAN VOLUMES ==="
          ORPHANS="$(printf '%s' "$VOLUMES" | jq -r --arg prod "$PROD_VOLUME" '.[] | select(.id != $prod and .name=="jevsentinel_data" and .state=="created" and .attached_machine_id==null) | [.id,.region,.created_at] | @tsv')"

          if [ -z "$ORPHANS" ]; then
            echo "No detached created jevsentinel_data volumes."
            exit 0
          fi

          NONEMPTY=0
          while IFS=$'\t' read -r VOL REGION CREATED; do
            [ -n "$VOL" ] || continue
            echo "--- auditing $VOL region=$REGION created=$CREATED ---"
            flyctl volumes snapshots list "$VOL" --app "$APP" || true
            CREATE_OUTPUT="$(flyctl machine run ubuntu:24.04 sleep 3600 --app "$APP" --region "$REGION" --volume "$VOL:/data" --name "audit-${VOL#vol_}" --detach 2>&1)"
            echo "$CREATE_OUTPUT"
            MACHINE_ID="$(printf '%s\n' "$CREATE_OUTPUT" | sed -n 's/.*Machine ID: \([a-z0-9]*\).*/\1/p' | tail -n1)"
            if [ -z "$MACHINE_ID" ]; then
              MACHINE_ID="$(flyctl machine list --app "$APP" --json | jq -r --arg n "audit-${VOL#vol_}" '[.[] | select(.name==$n)] | .[-1].id // empty')"
            fi
            test -n "$MACHINE_ID" || { echo "FAIL: could not identify audit machine for $VOL"; exit 1; }
            trap 'flyctl machine destroy "$MACHINE_ID" --app "$APP" --force >/dev/null 2>&1 || true' EXIT
            sleep 5
            set +e
            FILES="$(flyctl ssh console --app "$APP" --machine "$MACHINE_ID" -C 'find /data -type f ! -path "/data/lost+found/*" -print' 2>&1)"
            RC=$?
            set -e
            echo "$FILES"
            ORPHAN_GROUPS_HASH=""
            if [ "$RC" -eq 0 ]; then
              ORPHAN_GROUPS_HASH="$(flyctl ssh console --app "$APP" --machine "$MACHINE_ID" -C 'sha256sum /data/groups.enc' 2>/dev/null | awk '{print $1}' | tail -n1 || true)"
              echo "Orphan groups.enc SHA256=$ORPHAN_GROUPS_HASH"
              if [ -n "$ORPHAN_GROUPS_HASH" ] && [ "$ORPHAN_GROUPS_HASH" = "$PROD_GROUPS_HASH" ]; then
                echo "MATCHES_PRODUCTION_GROUPS_ENC=$VOL"
              fi
              rm -f ./orphan-groups.enc
              if flyctl ssh sftp get /data/groups.enc ./orphan-groups.enc --app "$APP" --machine "$MACHINE_ID" >/dev/null 2>&1; then
                ORPHAN_SUMMARY="$(node --input-type=module -e 'import {readFileSync,createDecipheriv,createHash} from "node:crypto"; const payload=JSON.parse(readFileSync("./orphan-groups.enc","utf8")); const key=createHash("sha256").update("JevSentinel/group-store/v1:").update(String(process.env.TELEGRAM_BOT_TOKEN).trim()).digest(); const d=createDecipheriv("aes-256-gcm",key,Buffer.from(payload.iv,"base64")); d.setAuthTag(Buffer.from(payload.tag,"base64")); const groups=JSON.parse(Buffer.concat([d.update(Buffer.from(payload.data,"base64")),d.final()]).toString("utf8")).groups; console.log(JSON.stringify({groupCount:groups.length,enabled:groups.filter(g=>g.enabled!==false).length,plaintextSha256:createHash("sha256").update(JSON.stringify(groups)).digest("hex")}));')"
                echo "ORPHAN_GROUP_STATE=$ORPHAN_SUMMARY"
                rm -f ./orphan-groups.enc
              else
                echo "ORPHAN_GROUP_STATE=unreadable"
              fi
            fi
            flyctl machine destroy "$MACHINE_ID" --app "$APP" --force || true
            trap - EXIT
            if [ "$RC" -ne 0 ]; then
              echo "FAIL: could not inspect $VOL"
              NONEMPTY=$((NONEMPTY + 1))
              continue
            fi
            if [ -n "$FILES" ]; then
              echo "NONEMPTY_ORPHAN=$VOL"
              NONEMPTY=$((NONEMPTY + 1))
            else
              echo "EMPTY_ORPHAN=$VOL"
            fi
          done <<< "$ORPHANS"

          test "$NONEMPTY" = "0" || { echo "FAIL: orphan volume(s) contain recoverable files; nothing deleted."; exit 1; }
          echo "PASS: all detached created jevsentinel_data volumes are empty. No volumes deleted."

# Final recovery verification: storage invariants are enforced in CI.

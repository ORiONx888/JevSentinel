name: JEV Sentinel CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Verify JEV API key
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "JEV API key is not configured."
            exit 1
          fi
          echo "JEV API key is configured."
      - name: Run official JEV SDK test
        run: npm run jev:test

name: JEV Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Verify Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          node --input-type=module -e 'const t=process.env.TELEGRAM_BOT_TOKEN; const r=await fetch("https://api.telegram.org/bot"+t+"/getMe"); const j=await r.json(); if(!r.ok||!j.ok) throw new Error("Telegram bot token verification failed"); console.log("Telegram bot connected: @"+j.result.username);'
      - name: Run official JEV SDK test
        run: npm run jev:test

  storage-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify production storage and audit orphan volumes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="jevsentinel"
          MACHINES="$(flyctl machine list --app "$APP" --json)"

          echo "=== CLEAN UP STALE AUDIT MACHINES ==="
          AUDIT_MACHINES="$(printf '%s' "$MACHINES" | jq -r '.[] | select(.name | startswith("audit")) | .id')"
          while IFS= read -r AUDIT_MACHINE; do
            [ -n "$AUDIT_MACHINE" ] || continue
            echo "Destroying stale audit machine $AUDIT_MACHINE"
            timeout 20s flyctl machine destroy "$AUDIT_MACHINE" --app "$APP" --force || true
          done <<< "$AUDIT_MACHINES"

          STALE_AUDIT_VOLUMES="$(flyctl volumes list --app "$APP" --json | jq -r '.[] | select(.name | startswith("audit")) | .id')"
          while IFS= read -r AUDIT_VOLUME; do
            [ -n "$AUDIT_VOLUME" ] || continue
            echo "Destroying stale audit volume $AUDIT_VOLUME"
            timeout 20s flyctl volumes destroy "$AUDIT_VOLUME" --app "$APP" --yes || true
          done <<< "$STALE_AUDIT_VOLUMES"

          MACHINES="$(flyctl machine list --app "$APP" --json)"
          VOLUMES="$(flyctl volumes list --app "$APP" --json)"

          MACHINE_COUNT="$(printf '%s' "$MACHINES" | jq 'length')"
          test "$MACHINE_COUNT" = "1" || { echo "FAIL: expected exactly 1 production machine after audit cleanup, found $MACHINE_COUNT"; exit 1; }
          PROD_MACHINE="$(printf '%s' "$MACHINES" | jq -r '.[0].id')"
          PROD_STATE="$(printf '%s' "$MACHINES" | jq -r '.[0].state')"
          test "$PROD_STATE" = "started" || { echo "FAIL: production machine $PROD_MACHINE is $PROD_STATE"; exit 1; }
          PROD_CONFIG="$(flyctl machine status "$PROD_MACHINE" --app "$APP" --display-config | sed -r 's/\x1B\[[0-9;]*[mK]//g')"
          ATTACHED_COUNT="$(printf '%s' "$VOLUMES" | jq '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)] | length')"
          test "$ATTACHED_COUNT" = "1" || { echo "FAIL: expected exactly 1 attached created jevsentinel_data volume, found $ATTACHED_COUNT"; exit 1; }
          PROD_VOLUME="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].id')"
          PROD_VOLUME_MACHINE="$(printf '%s' "$VOLUMES" | jq -r '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)][0].attached_machine_id')"
          test "$PROD_VOLUME_MACHINE" = "$PROD_MACHINE" || { echo "FAIL: production volume is attached to $PROD_VOLUME_MACHINE, not $PROD_MACHINE"; exit 1; }

          set +e
          GROUPS_CHECK="$(flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -s /data/groups.enc' 2>&1)"
          GROUPS_RC=$?
          set -e
          echo "$GROUPS_CHECK"
          test "$GROUPS_RC" = "0" || { echo "FAIL: production groups.enc check failed"; exit 1; }
          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'stat -c "groups.enc size=%s bytes" /data/groups.enc'

          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -f ./src/groupStore.js'

          set +e
          GROUPSTORE_CHECK="$(flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'node --input-type=module -e "import(\"./src/groupStore.js\").then(({createGroupStore})=>{const g=createGroupStore().load();console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length}));if(g.length!==1||g.filter(x=>x.enabled!==false).length!==1)process.exit(1)})"' 2>&1)"
          GROUPSTORE_RC=$?
          set -e
          echo "$GROUPSTORE_CHECK"
          test "$GROUPSTORE_RC" = "0" || { echo "FAIL: production groupStore check failed"; exit 1; }

          echo "=== PRODUCTION VOLUME ==="
          printf '%s' "$VOLUMES" | jq -r --arg id "$PROD_VOLUME" '.[] | select(.id==$id) | [.id,.state,.region,.attached_machine_id,.created_at] | @tsv'
          echo "=== ORPHAN VOLUME INVENTORY ==="
          ORPHANS="$(printf '%s' "$VOLUMES" | jq -r --arg prod "$PROD_VOLUME" '.[] | select(.id != $prod and .name=="jevsentinel_data" and .state=="created" and .attached_machine_id==null) | [.id,.region,.created_at] | @tsv')"
          if [ -z "$ORPHANS" ]; then
            echo "PASS: no detached created jevsentinel_data volumes."
          else
            echo "NOTICE: detached jevsentinel_data volume(s) exist:"
            printf '%s\n' "$ORPHANS"
            echo "NOTICE: orphan recovery is audited separately because Fly temporary-machine recovery is infrastructure-dependent and must not be conflated with production storage integrity."
          fi
          echo "PASS: production storage integrity checks passed; orphan recovery remains a separate audit."
          exit 0

name: Recover JevSentinel Group State

on:
  push:
    branches:
      - main

jobs:
  recover:
    runs-on: ubuntu-latest
    concurrency: jevsentinel-recovery
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fork known-good pre-09:16 group-state volume
        id: fork
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_VOLUME="vol_r68y69p98lkz0mn4"
          SOURCE_JSON="$(flyctl volumes list --app jevsentinel --json)"
          SOURCE_STATE="$(printf '%s' "$SOURCE_JSON" | jq -r --arg id "$SOURCE_VOLUME" '.[] | select(.id==$id) | .state')"
          SOURCE_ATTACHED="$(printf '%s' "$SOURCE_JSON" | jq -r --arg id "$SOURCE_VOLUME" '.[] | select(.id==$id) | .attached_machine_id // empty')"
          test "$SOURCE_STATE" = "created" || { echo "Recovery source volume is not in created state: $SOURCE_STATE"; exit 1; }
          test -z "$SOURCE_ATTACHED" || { echo "Recovery source volume is unexpectedly attached: $SOURCE_ATTACHED"; exit 1; }
          echo "Recovery source confirmed: $SOURCE_VOLUME"
          flyctl volumes snapshots list "$SOURCE_VOLUME" --app jevsentinel || true
          FORK_OUTPUT="$(flyctl volumes fork "$SOURCE_VOLUME" --app jevsentinel --name jevsentinel_data --json)"
          echo "$FORK_OUTPUT"
          FORK_ID="$(printf '%s' "$FORK_OUTPUT" | jq -r '.id // .ID // empty')"
          test -n "$FORK_ID" || { echo "Could not determine forked volume ID."; exit 1; }
          echo "FORK_ID=$FORK_ID" >> "$GITHUB_OUTPUT"

      - name: Clone current machine with recovered volume
        id: clone
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_MACHINE="$(flyctl machine list --app jevsentinel --json | jq -r '.[0].id // empty')"
          test -n "$CURRENT_MACHINE" || { echo "No current JevSentinel machine found."; exit 1; }
          echo "Current machine: $CURRENT_MACHINE"
          NEW_OUTPUT="$(flyctl machine clone "$CURRENT_MACHINE" --app jevsentinel --attach-volume "${{ steps.fork.outputs.FORK_ID }}:/data" --json)"
          echo "$NEW_OUTPUT"
          NEW_MACHINE="$(printf '%s' "$NEW_OUTPUT" | jq -r '.id // .ID // empty')"
          test -n "$NEW_MACHINE" || { echo "Could not determine recovered machine ID."; exit 1; }
          echo "NEW_MACHINE=$NEW_MACHINE" >> "$GITHUB_OUTPUT"

      - name: Verify recovered group store before removing old machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          NEW_MACHINE="${{ steps.clone.outputs.NEW_MACHINE }}"
          flyctl machine status "$NEW_MACHINE" --app jevsentinel
          flyctl ssh console --app jevsentinel --machine "$NEW_MACHINE" -C 'test -s /data/groups.enc && stat -c "Recovered /data/groups.enc size=%s bytes" /data/groups.enc'
          flyctl volumes list --app jevsentinel

      - name: Remove old machine only after recovery verification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          NEW_MACHINE="${{ steps.clone.outputs.NEW_MACHINE }}"
          CURRENT_MACHINE="$(flyctl machine list --app jevsentinel --json | jq -r --arg new "$NEW_MACHINE" '[.[] | select(.id != $new)] | sort_by(.created_at) | .[0].id // empty')"
          test -n "$CURRENT_MACHINE" || { echo "Could not identify old machine; refusing destructive cleanup."; exit 1; }
          echo "Recovered machine: $NEW_MACHINE"
          echo "Removing old machine: $CURRENT_MACHINE"
          flyctl machine destroy "$CURRENT_MACHINE" --app jevsentinel --yes

      - name: Final recovery verification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app jevsentinel
          flyctl volumes list --app jevsentinel
          flyctl ssh console --app jevsentinel -C 'test -s /data/groups.enc && stat -c "ACTIVE /data/groups.enc size=%s bytes" /data/groups.enc'

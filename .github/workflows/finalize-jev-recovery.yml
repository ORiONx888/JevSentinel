name: Finalize JevSentinel Recovery

on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify recovered machine and group store
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          RECOVERED_MACHINE="8d9eedb205ded8"
          RECOVERED_VOLUME="vol_4ojw8dnw815l572r"
          flyctl machine status "$RECOVERED_MACHINE" --app jevsentinel
          flyctl ssh console --app jevsentinel --machine "$RECOVERED_MACHINE" -C 'ls -l /data/groups.enc'
          flyctl ssh console --app jevsentinel --machine "$RECOVERED_MACHINE" -C 'wc -c /data/groups.enc'
          flyctl volumes show "$RECOVERED_VOLUME" --app jevsentinel

      - name: Remove only the pre-recovery machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine destroy "857100a4049168" --app jevsentinel --yes

      - name: Verify single recovered machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app jevsentinel
          flyctl volumes list --app jevsentinel
          flyctl machine status "8d9eedb205ded8" --app jevsentinel

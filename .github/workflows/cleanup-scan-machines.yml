name: Cleanup JEV Scan Machines

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Remove temporary scan machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list --app jevsentinel
          IDS="$(flyctl machine list --app jevsentinel --json | jq -r '.[] | select(.name | startswith("scan-")) | .id')"
          for id in $IDS; do
            echo "Force destroying temporary scan machine $id"
            flyctl machine destroy "$id" --app jevsentinel --force || true
          done
          echo "=== AFTER CLEANUP ==="
          flyctl machine list --app jevsentinel

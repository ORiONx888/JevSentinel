name: JEV Storage Integrity Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/storage-integrity-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency: jevsentinel-storage-audit
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Audit production machine, persistent volume, and orphan volumes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          APP="jevsentinel"
          VOLUMES="$(flyctl volumes list --app "$APP" --json)"
          MACHINES="$(flyctl machine list --app "$APP" --json)"

          echo "=== PRODUCTION MACHINE INVARIANT ==="
          MACHINE_COUNT="$(printf '%s' "$MACHINES" | jq 'length')"
          test "$MACHINE_COUNT" = "1" || {
            echo "FAIL: expected exactly 1 production machine; found $MACHINE_COUNT"
            printf '%s' "$MACHINES" | jq -r '.[] | [.id,.name,.state,.region,.created_at] | @tsv'
            exit 1
          }

          PROD_MACHINE="$(printf '%s' "$MACHINES" | jq -r '.[0].id')"
          PROD_STATE="$(printf '%s' "$MACHINES" | jq -r '.[0].state')"
          test "$PROD_STATE" = "started" || {
            echo "FAIL: production machine $PROD_MACHINE is $PROD_STATE"
            exit 1
          }

          echo "Production machine: $PROD_MACHINE ($PROD_STATE)"

          echo "=== PRODUCTION VOLUME INVARIANT ==="
          ATTACHED="$(printf '%s' "$VOLUMES" | jq '[.[] | select(.name=="jevsentinel_data" and .state=="created" and .attached_machine_id != null)]')"
          ATTACHED_COUNT="$(printf '%s' "$ATTACHED" | jq 'length')"
          test "$ATTACHED_COUNT" = "1" || {
            echo "FAIL: expected exactly 1 attached created jevsentinel_data volume; found $ATTACHED_COUNT"
            printf '%s' "$VOLUMES" | jq -r '.[] | [.id,.state,.name,.region,.attached_machine_id,.created_at] | @tsv'
            exit 1
          }

          PROD_VOLUME="$(printf '%s' "$ATTACHED" | jq -r '.[0].id')"
          PROD_VOLUME_MACHINE="$(printf '%s' "$ATTACHED" | jq -r '.[0].attached_machine_id')"
          PROD_VOLUME_REGION="$(printf '%s' "$ATTACHED" | jq -r '.[0].region')"

          test "$PROD_VOLUME_MACHINE" = "$PROD_MACHINE" || {
            echo "FAIL: production volume $PROD_VOLUME is attached to $PROD_VOLUME_MACHINE, not $PROD_MACHINE"
            exit 1
          }

          echo "Production volume: $PROD_VOLUME ($PROD_VOLUME_REGION) attached to $PROD_MACHINE"

          echo "=== PRODUCTION DATA CHECK ==="
          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'test -s /data/groups.enc && stat -c "groups.enc size=%s bytes" /data/groups.enc'
          flyctl ssh console --app "$APP" --machine "$PROD_MACHINE" -C 'node --input-type=module -e "import(\"./src/groupStore.js\").then(({createGroupStore})=>{const g=createGroupStore().load();console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length}))})"'

          echo "=== PRODUCTION SNAPSHOTS ==="
          flyctl volumes snapshots list "$PROD_VOLUME" --app "$APP" || true

          echo "=== ALL VOLUMES ==="
          printf '%s' "$VOLUMES" | jq -r '.[] | [.id,.state,.name,.region,(.attached_machine_id // "-"),.created_at] | @tsv'

          echo "=== ORPHAN VOLUME CONTENT AUDIT ==="
          ORPHANS="$(printf '%s' "$VOLUMES" | jq -r --arg prod "$PROD_VOLUME" '.[] | select(.id != $prod and .name=="jevsentinel_data" and .state=="created" and .attached_machine_id==null) | [.id,.region,.created_at] | @tsv')"

          if [ -z "$ORPHANS" ]; then
            echo "No detached created jevsentinel_data volumes found."
            exit 0
          fi

          NONEMPTY=0
          while IFS=$'\t' read -r VOL REGION CREATED; do
            [ -n "$VOL" ] || continue
            echo "--- ORPHAN $VOL region=$REGION created=$CREATED ---"
            flyctl volumes snapshots list "$VOL" --app "$APP" || true

            CREATE_OUTPUT="$(flyctl machine create ubuntu:24.04 --app "$APP" --region "$REGION" --volume "$VOL:/data" --name "audit-${VOL#vol_}" --detach 2>&1)"
            echo "$CREATE_OUTPUT"
            MACHINE_ID="$(printf '%s\n' "$CREATE_OUTPUT" | sed -n 's/.*Machine ID: \([a-z0-9]*\).*/\1/p' | tail -n1)"
            if [ -z "$MACHINE_ID" ]; then
              MACHINE_ID="$(flyctl machine list --app "$APP" --json | jq -r --arg n "audit-${VOL#vol_}" '[.[] | select(.name==$n)] | .[-1].id // empty')"
            fi
            test -n "$MACHINE_ID" || { echo "FAIL: could not identify audit machine for $VOL"; exit 1; }

            sleep 5
            set +e
            FILES="$(flyctl ssh console --app "$APP" --machine "$MACHINE_ID" -C 'find /data -mindepth 1 -maxdepth 2 -type f ! -path "/data/lost+found/*" -printf "%p %s bytes\\n" | sort' 2>&1)"
            RC=$?
            set -e
            echo "$FILES"

            flyctl machine destroy "$MACHINE_ID" --app "$APP" --force || true

            if [ "$RC" -ne 0 ]; then
              echo "FAIL: could not inspect orphan volume $VOL"
              exit 1
            fi

            if [ -n "$FILES" ]; then
              echo "NONEMPTY_ORPHAN=$VOL"
              NONEMPTY=$((NONEMPTY + 1))
            else
              echo "EMPTY_ORPHAN=$VOL"
            fi
          done <<< "$ORPHANS"

          test "$NONEMPTY" = "0" || {
            echo "FAIL: $NONEMPTY orphan volume(s) contain recoverable files. Nothing was deleted."
            exit 1
          }

          echo "PASS: all detached created jevsentinel_data volumes inspected and are empty."
          echo "No volume was deleted by this audit."

name: Scan JevSentinel Volumes For Group State

on:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scan detached ord volumes without modifying them
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -u
          VOLUMES="$(flyctl volumes list --app jevsentinel --json)"
          echo "=== DETACHED ORD VOLUMES ==="
          printf '%s' "$VOLUMES" | jq -r '.[] | select(.region=="ord" and .attached_machine_id==null and .state=="created") | [.id,.created_at] | @tsv' | sort -k2

          echo "=== GROUP STORE SCAN ==="
          printf '%s' "$VOLUMES" | jq -r '.[] | select(.region=="ord" and .attached_machine_id==null and .state=="created") | .id' | while read -r VOL; do
            [ -n "$VOL" ] || continue
            echo "--- checking $VOL ---"
            set +e
            CREATE_OUTPUT="$(flyctl machine create ubuntu:24.04 --app jevsentinel --region ord --volume "$VOL:/data" --name "scan-${VOL#vol_}" --json 2>&1)"
            CREATE_RC=$?
            set -e
            echo "$CREATE_OUTPUT"
            if [ "$CREATE_RC" -ne 0 ]; then
              echo "Unable to create inspection machine for $VOL"
              continue
            fi
            TMP_MACHINE="$(printf '%s' "$CREATE_OUTPUT" | jq -r '.id // .ID // empty')"
            if [ -z "$TMP_MACHINE" ]; then
              echo "Could not determine temporary machine ID for $VOL"
              continue
            fi
            flyctl machine start "$TMP_MACHINE" --app jevsentinel >/dev/null 2>&1 || true
            sleep 3
            set +e
            CHECK_OUTPUT="$(flyctl ssh console --app jevsentinel --machine "$TMP_MACHINE" -C 'ls -l /data/groups.enc' 2>&1)"
            CHECK_RC=$?
            set -e
            echo "$CHECK_OUTPUT"
            if [ "$CHECK_RC" -eq 0 ]; then
              echo "FOUND_GROUP_STORE=$VOL"
            fi
            flyctl machine destroy "$TMP_MACHINE" --app jevsentinel --yes || true
          done

name: One-time production verification

on:
  push:
    branches: [main]

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-js-live]')
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify deployed source and recent runtime logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machine list --app jevsentinel
          flyctl ssh console --app jevsentinel -C 'grep -n "value !== null && value !== undefined" ./src/engine.js'
          flyctl logs --app jevsentinel --no-tail | tail -n 300

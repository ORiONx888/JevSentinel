name: Emergency JEV Machine Cleanup

on:
  push:
    branches:
      - main

concurrency:
  group: emergency-jev-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Keep only known-good JEV machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          KEEP="857100a4049168"
          IDS="$(flyctl machine list --app jevsentinel --json | jq -r --arg keep "$KEEP" '.[] | select(.id != $keep) | .id')"
          printf '%s\n' "$IDS" | while read -r id; do
            [ -n "$id" ] || continue
            echo "Destroying duplicate $id"
            flyctl machine destroy "$id" --app jevsentinel --force || true &
          done
          wait
          sleep 5
          echo "=== FINAL MACHINES ==="
          flyctl machine list --app jevsentinel
          echo "=== FINAL VOLUMES ==="
          flyctl volumes list --app jevsentinel

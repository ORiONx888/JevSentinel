name: Restore JEV persisted monitoring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-jev-monitoring.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restore persisted JEV group monitoring
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="jevsentinel"
          MACHINES="$(flyctl machine list --app "$APP" --json)"
          test "$(printf '%s' "$MACHINES" | jq 'length')" = "1"
          MACHINE="$(printf '%s' "$MACHINES" | jq -r '.[0].id')"
          test "$(printf '%s' "$MACHINES" | jq -r '.[0].state')" = "started"
          flyctl ssh console --app "$APP" --machine "$MACHINE" -C 'node --input-type=module -e "import(\"./src/groupStore.js\").then(({createGroupStore})=>{const s=createGroupStore();const g=s.load();s.save(g.map(x=>({...x,enabled:true})));console.log(JSON.stringify({groupCount:g.length,enabled:g.filter(x=>x.enabled!==false).length}))})"'
